# 3 storage nodes + 1 router + monitoring dashboard.
#   docker compose up --build -d
#   curl -X PUT -d 'hello' localhost:8080/kv/greeting
#   open http://localhost:3000    # dashboard
#   docker compose stop node2     # simulate a node failure
#   docker compose start node2    # node comes back and catches up
#
# The nodes and the router use the same image; the command picks the role.

x-kv-service: &kv-service
  build: .
  image: distributed-kv-store:latest

services:
  node1:
    <<: *kv-service
    command: ["node"]
    ports:
      - "8081:8080"
    volumes:
      - node1-data:/data

  node2:
    <<: *kv-service
    command: ["node"]
    ports:
      - "8082:8080"
    volumes:
      - node2-data:/data

  node3:
    <<: *kv-service
    command: ["node"]
    ports:
      - "8083:8080"
    volumes:
      - node3-data:/data

  router:
    <<: *kv-service
    command: ["router"]
    environment:
      NODES: node1:8080,node2:8080,node3:8080
      REPLICATION_FACTOR: "2"
      WRITE_QUORUM: "1"
    ports:
      - "8080:8080"
    depends_on:
      - node1
      - node2
      - node3

  dashboard:
    build: ./dashboard
    image: kv-dashboard:latest
    environment:
      ROUTER_URL: http://router:8080
    ports:
      - "3000:3000"
    depends_on:
      - router

volumes:
  node1-data:
  node2-data:
  node3-data:
